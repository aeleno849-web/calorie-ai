<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Calorie Ai</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Hind+Siliguri:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width app column (full-bleed on phones, framed on desktop), a gradient
   calorie hero, a five-slot tab bar with a raised scan button, and full-height layers for
   scan / result / setup. Palette: tinted neutrals plus one gradient pair (default Mango,
   switchable in Profile); macro colours stay fixed so protein/carbs/fat always read the same. */
:root{
  --bg:#F6F5F3; --surface:#FFFFFF; --surface-2:#EBE9E6; --ink:#1C1613; --ink-2:#5E5752; --ink-3:#8F8781;
  --line:rgba(28,22,19,.08); --btn:#1C1613; --btn-ink:#FFFFFF; --backdrop:#DAD6D2;
  --leaf:#F25C05; --lime:#FF9A2E; --ha:#F25C05; --hb:#D6205F; --flame:#F2701E;
  --protein:#E8366D; --carbs:#F2B600; --fat:#3D7CF4; --water:#2E9BFF;
  --good:#12A15B; --warn:#E08A00; --bad:#E03B3B;
  --shadow:0 1px 2px rgba(28,22,19,.05),0 10px 28px rgba(28,22,19,.08);
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0B0A; --surface:#1A1614; --surface-2:#272220; --ink:#F6F1EE; --ink-2:#B1A8A2; --ink-3:#7C726C;
  --line:rgba(246,241,238,.09); --btn:#F6F1EE; --btn-ink:#0E0B0A; --backdrop:#060403;
  --leaf:#FF8A3D; --lime:#FFB067; --ha:#F25C05; --hb:#D6205F; --flame:#FF8440;
  --protein:#FF5C8A; --carbs:#FFCB2E; --fat:#6C9BFF; --water:#4FB0FF;
  --good:#2FD283; --warn:#FFB52E; --bad:#FF6B6B;
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 10px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0B0A; --surface:#1A1614; --surface-2:#272220; --ink:#F6F1EE; --ink-2:#B1A8A2; --ink-3:#7C726C;
  --line:rgba(246,241,238,.09); --btn:#F6F1EE; --btn-ink:#0E0B0A; --backdrop:#060403;
  --leaf:#FF8A3D; --lime:#FFB067; --ha:#F25C05; --hb:#D6205F; --flame:#FF8440;
  --protein:#FF5C8A; --carbs:#FFCB2E; --fat:#6C9BFF; --water:#4FB0FF;
  --good:#2FD283; --warn:#FFB52E; --bad:#FF6B6B;
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 10px 28px rgba(0,0,0,.45); color-scheme:dark}
[hidden]{display:none!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--backdrop);color:var(--ink);font:500 15px/1.4 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.ic{display:block;flex:none}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disp{font-family:var(--font-display);letter-spacing:-.025em}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.sm{font-size:13px}.xs{font-size:11.5px}
.up{text-transform:uppercase;letter-spacing:.09em;font-weight:700;font-size:11px;color:var(--ink-2)}
.bn{font-family:'Hind Siliguri',var(--font-body);font-weight:500}
.tab-num,[data-count],[data-n],[data-i]{font-variant-numeric:tabular-nums}

#stage{height:100%;display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100%;height:100%;max-width:440px;background:var(--bg);overflow:hidden;overflow:clip;display:flex;flex-direction:column}
@media (min-width:600px){#stage{padding:18px 0}#app{height:min(100%,900px);border-radius:40px;box-shadow:0 0 0 1px var(--line),0 40px 90px rgba(0,0,0,.22)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:128px;scrollbar-width:none;overscroll-behavior:contain}
#view::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}
.stack{display:flex;flex-direction:column;gap:12px}

.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
@keyframes sweep{from{top:-70px}to{top:calc(100% - 50px)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes wave{to{transform:translateX(-50%)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 24px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font:700 16px var(--font-body);transition:transform .2s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.btn.acc{background:linear-gradient(135deg,var(--ha),var(--hb));color:#fff}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{height:42px;padding:0 16px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.danger{background:var(--bad);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:13px;transition:background .25s,color .25s}
.chip.on{background:var(--btn);color:var(--btn-ink)}
.chip.ex{height:20px;padding:0 8px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2)}
.cbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);transition:transform .2s}
.cbtn:active{transform:scale(.92)}

/* header + week */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.brand{display:flex;align-items:center;gap:8px;font:800 24px var(--font-display);letter-spacing:-.04em}
.brand svg{color:var(--leaf)}
.brand .logo{width:30px;height:30px;object-fit:contain;flex:none}
.streak{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 11px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:800}
.streak svg{color:var(--flame)}
.dtitle{padding-top:14px}
.dtitle h1{font:800 34px/1.05 var(--font-display);letter-spacing:-.035em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0}
.day .dl{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-3)}
.day .dc{position:relative;width:42px;height:42px;display:grid;place-items:center}
.day .dc .ring{position:absolute;inset:0}
.dn{position:relative;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13.5px;transition:background .3s,color .3s,transform .3s cubic-bezier(.3,1.5,.5,1)}
.day.sel .dn{background:var(--btn);color:var(--btn-ink);transform:scale(1.06)}
.day.sel .dl{color:var(--ink)}
.day.fut{opacity:.38;pointer-events:none}

/* rings */
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring>svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
.trk{fill:none;stroke:var(--surface-2)}
.prg{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1),opacity .3s}
.ring-in{position:relative;display:grid;place-items:center}

/* home cards */
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 20px 24px;margin-top:2px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--ha),var(--hb));color:#fff;cursor:pointer}
.hero::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 65%);pointer-events:none}
.hero>*{position:relative}
.hero .trk{stroke:rgba(255,255,255,.28)}
.hero .sub,.hero .lab{color:rgba(255,255,255,.92)}
.hero .sub b{color:#fff!important}
.hero .more{display:inline-flex;align-items:center;gap:2px;margin-top:10px;height:26px;padding:0 10px 0 12px;border-radius:999px;background:rgba(255,255,255,.2);font-weight:700;font-size:12px}
.hero .big{font:800 60px/.95 var(--font-display);letter-spacing:-.045em}
.hero .lab{font-weight:700;margin-top:6px}
.hero .sub{margin-top:10px}
.hero.over{background:linear-gradient(135deg,#B3261E,#E03B3B)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 14px 14px}
.macro .mn{font:800 25px/1 var(--font-display);letter-spacing:-.03em}
.macro .mn small{font:700 13px var(--font-body);color:var(--ink-2);margin-left:1px;letter-spacing:0}
.macro .ml{font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:10px}
.macro .ring{align-self:center}
.mdot{width:9px;height:9px;border-radius:50%}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden;min-height:156px}
.mini .big{font:800 34px/1 var(--font-display);letter-spacing:-.035em}
.mini .big small{font:700 13px var(--font-body);color:var(--ink-2);letter-spacing:0;margin-left:3px}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:auto}
.meter i{height:8px;border-radius:4px;background:var(--surface-2);transition:background .4s calc(var(--k)*50ms)}
.meter i.f{background:var(--c,var(--leaf))}
.wbtns{display:flex;gap:6px;margin-top:auto;position:relative;z-index:2}
.wbtns button{height:36px;min-width:36px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:13px;display:grid;place-items:center}
.wbtns button.pri{background:var(--btn);color:var(--btn-ink)}
.glass{position:absolute;right:12px;top:12px;width:44px;height:68px;border-radius:14px 14px 18px 18px;background:var(--surface-2);overflow:hidden}
.glass .fill{position:absolute;left:0;right:0;bottom:0;background:var(--water);transition:height 1s cubic-bezier(.2,.8,.2,1);opacity:.92}
.glass .fill svg{position:absolute;left:0;top:-7px;width:200%;height:8px;animation:wave 2.6s linear infinite;fill:var(--water)}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:10px 2px 0}
.sec h2{font:800 20px var(--font-display);letter-spacing:-.025em}
.meal{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 10px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);transition:transform .2s}
.meal:active{transform:scale(.985)}
.thumb{width:64px;height:64px;border-radius:18px;background:var(--surface-2);flex:none;display:grid;place-items:center;font-size:30px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.mb{flex:1;min-width:0}
.mn2{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px}
.mn2 span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mm{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.mm .m{display:inline-flex;align-items:center;gap:4px}
.kc{text-align:right;flex:none}
.kc b{display:block;font:800 21px/1 var(--font-display);letter-spacing:-.03em}
.kc span{font-size:11px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px 24px}
.empty .eg{width:84px;height:84px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--leaf);animation:float 3.4s ease-in-out infinite}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:20;padding-top:44px;padding-bottom:12px;pointer-events:none;background:linear-gradient(to top,var(--bg) 38%,transparent)}
.navbar{pointer-events:auto;position:relative;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;height:66px;border-radius:28px;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;color:var(--ink-3);font-weight:700;font-size:10.5px;transition:color .3s}
.tab .ti{display:grid;place-items:center;width:46px;height:28px;border-radius:14px;transition:background .35s,color .35s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.tab.on{color:var(--ink)}
.tab.on .ti{background:color-mix(in srgb,var(--leaf) 17%,transparent);color:var(--leaf);transform:translateY(-1px)}
.fab{justify-self:center;margin-top:-34px;position:relative;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--ha),var(--hb));color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px color-mix(in srgb,var(--hb) 45%,transparent),0 0 0 5px var(--bg);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.fab:active{transform:scale(.9) rotate(-8deg)}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--hb);animation:pulse 2.8s ease-out infinite;pointer-events:none}

/* progress */
.ph{padding-top:16px}.ph h1{font:800 34px/1.05 var(--font-display);letter-spacing:-.035em}
.wt{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.wt .big{font:800 44px/1 var(--font-display);letter-spacing:-.04em}
.wt .big small{font:700 15px var(--font-body);color:var(--ink-2);letter-spacing:0;margin-left:4px}
.delta{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-weight:700;font-size:12.5px;background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.delta.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.chart text{fill:var(--ink-3);font:600 10px var(--font-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--leaf);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:draw 1.4s .15s cubic-bezier(.3,.7,.2,1) both}
.chart .ar{animation:fadein 1.2s .5s both}
.chart .cbar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s calc(var(--i)*70ms) cubic-bezier(.2,.8,.2,1) both}
.chart .pd{animation:pop .5s 1.3s both}
.chart .halo{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s 1.6s ease-out infinite}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);font-weight:600;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.split{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:3px;margin:12px 0 12px}
.split i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.srow b{display:block;font:800 22px/1.1 var(--font-display);letter-spacing:-.03em}
.bmi-scale{position:relative;height:12px;border-radius:99px;margin:20px 0 8px;background:linear-gradient(to right,var(--fat) 0%,var(--good) 28%,var(--good) 52%,var(--carbs) 66%,var(--protein) 100%)}
.bmi-mark{position:absolute;top:-6px;width:4px;height:24px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 3px var(--surface);left:0;transition:left 1.2s cubic-bezier(.2,.8,.2,1)}
.sdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.sdots div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink-3)}
.sdots i{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--btn-ink);transition:background .4s calc(var(--k)*80ms),transform .4s calc(var(--k)*80ms) cubic-bezier(.3,1.6,.5,1);transform:scale(.8)}
.sdots i.f{background:var(--leaf);transform:scale(1)}

/* profile */
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow b{font-weight:700}
.plan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pg{padding:14px;border-radius:20px;background:var(--surface-2)}
.pg b{display:block;font:800 26px/1.1 var(--font-display);letter-spacing:-.03em}
.pg b small{font:700 12px var(--font-body);color:var(--ink-2);letter-spacing:0}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.aipill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:12.5px}
.aipill i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.aipill.ok i{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.aipill.off i{background:var(--warn)}

/* layers */
.layer{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;visibility:hidden;transform:translateY(100%);transition:transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .55s;overflow:hidden}
.layer.on{visibility:visible;transform:none;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}

/* scan layer (deliberately dark camera UI in both themes) */
#scan{background:radial-gradient(120% 70% at 50% 25%,#16261C 0%,#070B08 62%);color:#fff;--cam:#fff;--cam-dim:rgba(255,255,255,.62);--cam-line:rgba(255,255,255,.16);--cam-glass:rgba(255,255,255,.1);z-index:50}
.sc-top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
#scan .cbtn{background:var(--cam-glass);color:var(--cam);box-shadow:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#scan .aipill{background:var(--cam-glass);color:var(--cam)}
.sc-stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.vf{position:relative;margin:auto;width:min(76%,310px);aspect-ratio:1;display:grid;place-items:center;animation:fadein .5s both}
.vf.wide{aspect-ratio:4/3;width:min(86%,360px)}
.vf-ring{position:absolute;inset:7%;border-radius:50%;border:2px dashed rgba(255,255,255,.26);animation:spin 30s linear infinite}
.vf.wide .vf-ring{display:none}
.vf-dot{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle,rgba(181,229,73,.2),transparent 70%);animation:breathe 3.2s ease-in-out infinite}
.vf .c{position:absolute;width:38px;height:38px;border:3.5px solid var(--cam);border-radius:10px;animation:breathe 3.2s ease-in-out infinite}
.c.tl{top:0;left:0;border-right:0;border-bottom:0}.c.tr{top:0;right:0;border-left:0;border-bottom:0}
.c.bl{bottom:0;left:0;border-right:0;border-top:0}.c.br{bottom:0;right:0;border-left:0;border-top:0}
.vf-hint{position:absolute;bottom:-46px;left:0;right:0;text-align:center;color:var(--cam-dim);font-weight:600;font-size:14px}
.vf-line{position:absolute;left:6%;right:6%;height:2px;background:var(--lime);box-shadow:0 0 18px 4px rgba(181,229,73,.55);border-radius:2px;animation:sweep 2.8s ease-in-out infinite alternate;top:0}
.sc-bottom{padding-bottom:16px}
.modes{display:flex;justify-content:center;gap:6px;padding:12px 0 14px}
.mode{height:38px;padding:0 15px;border-radius:999px;color:var(--cam-dim);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;transition:background .3s,color .3s}
.mode.on{background:var(--cam);color:#0A110D}
.ctrls{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 6px}
.ctrls .sp{width:52px}
.gal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--cam-glass);color:var(--cam)}
.shutter{position:relative;width:82px;height:82px;border-radius:50%;border:4px solid var(--cam);display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.shutter i{width:62px;height:62px;border-radius:50%;background:var(--cam);transition:transform .2s;display:grid;place-items:center;color:#0A110D}
.shutter:active{transform:scale(.92)}
.shutter:active i{transform:scale(.88)}
.txt-panel{margin:auto 0;display:flex;flex-direction:column;gap:14px;animation:fadein .5s both}
.txt-panel h2{font:800 28px/1.1 var(--font-display);letter-spacing:-.03em}
.txt-panel textarea{width:100%;min-height:128px;resize:none;border-radius:22px;border:1px solid var(--cam-line);background:var(--cam-glass);color:var(--cam);font:500 17px/1.45 var(--font-body);padding:16px}
.txt-panel textarea::placeholder{color:rgba(255,255,255,.4)}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{height:34px;padding:0 13px;border-radius:999px;background:var(--cam-glass);color:var(--cam);font-weight:600;font-size:13px}
.an{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding-bottom:16px;animation:fadein .4s both}
.an-img{position:relative;flex:1;min-height:150px;border-radius:30px;overflow:hidden;background:#0d1610;display:grid;place-items:center}
.an-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.an-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.22),transparent 30%,rgba(0,0,0,.4))}
.scanline{position:absolute;left:0;right:0;height:120px;top:0;z-index:2;background:linear-gradient(transparent,rgba(181,229,73,.22) 46%,var(--lime) 50%,rgba(181,229,73,.22) 54%,transparent);animation:sweep 2.4s ease-in-out infinite alternate;pointer-events:none}
.an-img .c{position:absolute;z-index:3;width:34px;height:34px;border:3.5px solid var(--cam);border-radius:10px;margin:14px;animation:breathe 2.4s ease-in-out infinite}
.say{position:relative;z-index:3;margin:20px;padding:22px;border-radius:24px;background:var(--cam-glass);font:600 20px/1.4 var(--font-body);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.panel{padding:18px;border-radius:28px;background:var(--cam-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.panel h3{font:800 20px var(--font-display);letter-spacing:-.02em;margin-bottom:12px}
.steps{display:flex;flex-direction:column;gap:9px}
.steps li{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.4);font-weight:600;font-size:14.5px;transition:color .4s}
.steps li .dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;transition:all .4s;flex:none}
.steps li.act{color:#fff}.steps li.act .dot{border-color:var(--lime);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:rgba(255,255,255,.8)}.steps li.done .dot{background:var(--lime);border-color:var(--lime);color:#0A110D}
.bar{height:6px;border-radius:99px;background:var(--cam-glass);overflow:hidden;margin:14px 0 12px}
.bar i{display:block;height:100%;width:8%;border-radius:99px;background:linear-gradient(90deg,var(--leaf),var(--lime));transition:width .6s ease}
.bar.ind i{width:40%;background:linear-gradient(90deg,transparent,var(--lime),transparent);background-size:200% 100%;animation:shimmer 1.4s linear infinite;width:100%}
.err{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:0 10px;animation:fadein .4s both}
.err .eg{width:78px;height:78px;border-radius:50%;background:var(--cam-glass);display:grid;place-items:center;color:var(--lime)}
.err h2{font:800 26px/1.15 var(--font-display);letter-spacing:-.03em}
.err p{color:var(--cam-dim);max-width:30ch}
.err .acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:8px}
#scan .btn{background:var(--cam);color:#0A110D}
#scan .btn.ghost{background:var(--cam-glass);color:var(--cam);box-shadow:none}

/* result layer */
#result{background:var(--bg);z-index:60}
.rh{position:relative;height:290px;flex:none;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.rh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fadein .6s both}
.rh .big-emoji{font-size:110px;animation:float 3.6s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(0,0,0,.18))}
.rh::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.28),transparent 34%);pointer-events:none}
.rh .tl{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));z-index:2}
.rh .tr{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));z-index:2}
.rh .tl .cbtn,.rh .tr .cbtn{background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.conf{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.conf svg{color:var(--leaf)}
.rb{position:relative;margin-top:-30px;border-radius:32px 32px 0 0;background:var(--bg);padding-top:20px;padding-bottom:150px}
.rt{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.rt h1{font:800 29px/1.08 var(--font-display);letter-spacing:-.035em}
.rt .bn{font-size:15px;margin-top:3px}
.stepper{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);flex:none}
.stepper button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.stepper b{min-width:34px;text-align:center;font-weight:800;font-size:15px}
.types{display:flex;gap:6px;flex-wrap:wrap}
.kcal-card{display:flex;align-items:center;gap:16px}
.kcal-card .fl{width:56px;height:56px;border-radius:20px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;flex:none}
.kcal-card .big{font:800 46px/1 var(--font-display);letter-spacing:-.045em}
.kcal-card .big small{font:700 15px var(--font-body);color:var(--ink-2);letter-spacing:0;margin-left:5px}
.gbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--c,var(--leaf));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m3 .card{padding:14px;display:flex;flex-direction:column;gap:6px}
.m3 .lbl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.m3 .v{font:800 26px/1 var(--font-display);letter-spacing:-.03em}
.m3 .v small{font:700 13px var(--font-body);color:var(--ink-2);letter-spacing:0}
.m3 .pc{font-size:11.5px;color:var(--ink-2);font-weight:600}
.hs{display:flex;align-items:center;gap:14px}
.hs .sc{font:800 40px/1 var(--font-display);letter-spacing:-.04em;min-width:76px}
.hs .sc small{font:700 14px var(--font-body);color:var(--ink-2);letter-spacing:0}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}
.item .ie{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:23px;flex:none}
.item .in{flex:1;min-width:0}.item .in b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .in span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.item .ik{font-weight:800;text-align:right;flex:none}
.item .ik small{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
.ngrp{margin-top:6px}
.ngrp h4{margin:14px 0 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.nrow{display:grid;grid-template-columns:1fr auto 44px;align-items:center;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow .nn{font-weight:600}
.nrow .nv{font-weight:700;text-align:right}
.nrow .nv small{color:var(--ink-2);font-weight:600}
.nrow .nd{font-size:12px;font-weight:700;color:var(--ink-2);text-align:right}
.nrow .gbar{grid-column:1/-1;height:5px}
.tips li{display:flex;gap:10px;padding:8px 0;font-weight:500}
.tips li svg{color:var(--leaf);margin-top:2px}
.alg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rfoot{position:absolute;left:0;right:0;bottom:0;padding-top:44px;padding-bottom:14px;background:linear-gradient(to top,var(--bg) 0,var(--bg) calc(100% - 40px),transparent 100%);display:flex;flex-direction:column;gap:10px}
.rfoot .after{text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.rfoot .acts{display:flex;gap:10px}
.rfoot .acts .btn{flex:1}
.fixbox{display:none;flex-direction:column;gap:10px;padding:14px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}
.fixbox.on{display:flex;animation:rise .4s both}
.fixbox textarea,.in-field{width:100%;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 16px/1.4 var(--font-body);padding:12px 14px;resize:none}
.busy{position:absolute;inset:0;z-index:5;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.busy.on{display:grid;animation:fadein .3s both}
.busy div{display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:700}
.spin{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--surface-2);border-top-color:var(--leaf);animation:spin .8s linear infinite}

/* onboarding */
#onb{background:var(--bg);z-index:80}
.ob-top{display:flex;align-items:center;gap:12px;padding-top:14px}
.ob-prog{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ob-prog i{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.ob-prog i::after{content:"";position:absolute;inset:0;background:var(--btn);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.ob-prog i.f::after{transform:none}
.ob-body{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:16px;padding-top:18px;padding-bottom:12px}
.ob-body h1{font:800 34px/1.05 var(--font-display);letter-spacing:-.04em}
.ob-foot{padding-top:10px;padding-bottom:16px;display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.opt{height:54px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;text-align:center;display:grid;place-items:center;transition:background .25s,color .25s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.seg button.on,.opt.on{background:var(--btn);color:var(--btn-ink)}
.seg button:active,.opt:active{transform:scale(.97)}
.opt{height:auto;padding:14px 16px;text-align:left;justify-items:start;gap:2px}
.opt small{font-weight:500;opacity:.7;font-size:13px}
.opts{display:flex;flex-direction:column;gap:8px}
.fld{padding:14px 16px 4px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}
.frow{display:flex;justify-content:space-between;align-items:baseline}
.frow span{font-weight:700;color:var(--ink-2)}
.frow b{font:800 30px/1 var(--font-display);letter-spacing:-.035em}
.frow b small{font:700 13px var(--font-body);color:var(--ink-2);letter-spacing:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:4px 0 0;background:transparent;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to right,var(--leaf) var(--p),var(--surface-2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.25),0 0 0 3px var(--leaf)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--surface-2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--leaf)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--surface);border:0;box-shadow:0 2px 8px rgba(0,0,0,.25),0 0 0 3px var(--leaf)}
.splash{display:grid;place-items:center;height:290px;position:relative}
.plate{position:relative;width:236px;height:236px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow),inset 0 0 0 10px var(--surface-2);display:grid;place-items:center;animation:pop .8s both}
.plate::before{content:"";position:absolute;inset:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line)}
.blob{position:absolute;border-radius:50%;animation:float 4s ease-in-out infinite}
.fchip{position:absolute;padding:8px 13px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:13px;display:flex;gap:7px;align-items:center;animation:float 4.6s ease-in-out infinite,rise .8s both}
.fchip i{width:9px;height:9px;border-radius:50%}
.build{display:flex;flex-direction:column;align-items:center;gap:22px;margin:auto 0}
.build .steps li{color:var(--ink-3)}
.build .steps li.act{color:var(--ink)}.build .steps li.act .dot{border-color:var(--leaf);border-top-color:transparent}
.build .steps li.done{color:var(--ink-2)}.build .steps li.done .dot{background:var(--leaf);border-color:var(--leaf);color:#fff}
.build .steps li .dot{border-color:var(--surface-2)}
.plan-big{font:800 76px/.95 var(--font-display);letter-spacing:-.05em}

/* sheet + toast */
.sheet-wrap{position:absolute;inset:0;z-index:90;visibility:hidden;transition:visibility 0s .4s}
.sheet-wrap.on{visibility:visible;transition:none}
.sheet-bd{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .35s}
.sheet-wrap.on .sheet-bd{opacity:1}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:32px 32px 0 0;padding-top:12px;padding-bottom:22px;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
.sheet-wrap.on .sheet-panel{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--surface-2);margin:0 auto 4px}
.sheet-panel h2{font:800 24px var(--font-display);letter-spacing:-.03em}
.wbig{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 0}
.wbig .v{font:800 56px/1 var(--font-display);letter-spacing:-.045em;min-width:170px;text-align:center}
.wbig .v small{font:700 18px var(--font-body);color:var(--ink-2);letter-spacing:0}
.wbig button{width:52px;height:52px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.toast{z-index:95;position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:104px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 18px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:14px;box-shadow:0 14px 34px rgba(0,0,0,.28);transform:translateY(24px) scale(.96);opacity:0;visibility:hidden;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .3s,visibility 0s .45s}
.toast.on{transform:none;opacity:1;visibility:visible;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.toast button{height:32px;padding:0 14px;border-radius:999px;background:color-mix(in srgb,var(--btn-ink) 18%,transparent);font-weight:800;font-size:13px}


/* coach chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-top:6px;padding-bottom:210px}
.msg{max-width:90%;padding:12px 15px;border-radius:22px;font-weight:500;line-height:1.5;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--ha),var(--hb));color:#fff;border-bottom-right-radius:7px}
.msg.a{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:7px}
.msg.a p{margin:0 0 6px}.msg.a p:last-child{margin:0}
.msg.a ul{margin:4px 0 6px 18px;padding:0;list-style:disc}.msg.a li{margin:2px 0}
.msg.err{color:var(--bad)}
.typing{display:flex;gap:5px;align-items:center;height:44px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);animation:bounce 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.coach-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 6px 6px}
.coach-empty .av{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ha),var(--hb));animation:float 3.4s ease-in-out infinite}
.sugs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.sugs button{padding:10px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:13.5px;text-align:left}
.chatbar{position:absolute;left:0;right:0;bottom:106px;z-index:18}
.cb-in{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 16px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.cb-in textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:500 16px/1.4 var(--font-body);resize:none;max-height:120px;padding:9px 0}
.send{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ha),var(--hb));transition:transform .2s}
.send:active{transform:scale(.9)}.chatbar.busy .send{opacity:.45;pointer-events:none}
/* settings */
.sw-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.sw i{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#fff;box-shadow:0 0 0 0 var(--ink);transition:box-shadow .25s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.sw i svg{opacity:0;transform:scale(.4);transition:all .25s}
.sw.on{color:var(--ink)}.sw.on i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink);transform:scale(1.04)}.sw.on i svg{opacity:1;transform:none}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding:4px;border-radius:999px;background:var(--surface-2)}
.seg3.seg2{grid-template-columns:1fr 1fr}
.seg3 button{height:38px;border-radius:999px;font-weight:700;font-size:13.5px;text-align:center;color:var(--ink-2);transition:background .3s,color .3s}
.seg3 button.on{background:var(--btn);color:var(--btn-ink)}
.keybox{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.keybox .krow{display:flex;gap:8px}.keybox .krow .btn{flex:1}
/* item editing */
.item{flex-wrap:wrap}
.ied{flex-basis:100%;display:flex;align-items:center;gap:10px;padding:4px 0 2px 56px}
.stepper.sm{padding:3px}.stepper.sm button{width:28px;height:28px}.stepper.sm b{min-width:50px;font-size:13.5px}
.ied .rm{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--bad);padding:6px 8px}
/* scan extras */
.camvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .5s}
#scan.live .camvid{opacity:1}
#scan.live::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 25%,transparent 55%,rgba(0,0,0,.65));pointer-events:none}
#scan>.sc-top,#scan>.sc-stage,#scan>.sc-bottom,#scan>.txt-panel,#scan>.an,#scan>.err{position:relative;z-index:2}
#scan.snap::after{content:"";position:absolute;inset:0;background:#fff;z-index:9;animation:fadein .28s reverse both;pointer-events:none}
.note-in{width:100%;height:44px;border-radius:999px;border:1px solid var(--cam-line);background:var(--cam-glass);color:var(--cam);padding:0 18px;font:500 14px var(--font-body);margin-top:4px}
.note-in::placeholder{color:rgba(255,255,255,.45)}
.txt-wrap{position:relative}
.mic{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cam);color:#0A110D}
.mic.rec{background:var(--bad);color:#fff;animation:breathe 1s ease-in-out infinite}
.vlang{display:flex;gap:6px}.vlang button{height:30px;padding:0 12px;border-radius:999px;background:var(--cam-glass);color:var(--cam);font-weight:700;font-size:12.5px}.vlang button.on{background:var(--cam);color:#0A110D}
.err .code{font-size:11.5px;opacity:.55;font-family:ui-monospace,monospace}
.sheet-panel{max-height:88%;overflow-y:auto;scrollbar-width:none}
.sheet-panel::-webkit-scrollbar{display:none}
.drow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.drow b{font-weight:800}.drow span{color:var(--ink-2);font-weight:600;font-size:13px}
.bigflame{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;margin:0 auto;color:#fff;background:linear-gradient(135deg,var(--flame),var(--hb))}
.pill-act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-weight:700;font-size:13px;box-shadow:var(--shadow)}
@media (max-height:700px){.rh{height:210px}.splash{height:230px}.plate{width:190px;height:190px}.hero .big{font-size:52px}}
/* ads + scan limit */
.promo{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;padding:14px 14px 14px 18px;border-radius:24px;background:linear-gradient(135deg,var(--ha),var(--hb));color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:left}
.promo::before{content:"";position:absolute;right:-50px;top:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%);pointer-events:none}
.promo>*{position:relative}
.promo b{display:block;font:800 16px/1.2 var(--font-display);letter-spacing:-.02em}
.promo .bn{display:block;font-size:13px;opacity:.95;margin-top:2px}
.promo small{display:block;font-size:11.5px;font-weight:700;opacity:.85;margin-top:4px}
.promo .pbtn{flex:none;height:40px;padding:0 16px;border-radius:999px;background:#fff;color:#1C1613;font-weight:800;font-size:14px;display:grid;place-items:center;animation:breathe 2.6s ease-in-out infinite}
.promo.on{background:linear-gradient(135deg,#0B8F4D,#2FA84F)}
.adsteps{display:flex;flex-direction:column;gap:8px}
.adstep{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--surface-2);font-weight:700}
.adstep i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;background:var(--surface);color:var(--ink-2)}
.adstep.done{color:var(--ink-2)}.adstep.done i{background:var(--good);color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}.chart .ln{stroke-dasharray:none}}
</style>

function mkMeal(k,dk,h,m,qty=1){

  const items=t.i.map(a=>{const n={};NK.forEach((key,idx)=>{n[key]=idx<4?a[4+idx]:Math.round(t.x[idx]*a[4]/sc*10)/10});
    return {name:a[0],name_bn:a[1],emoji:a[2],grams:a[3],scale:1,n}});
  return {id:uid(),ts:d.getTime(),name:t.n,name_bn:t.bn,emoji:t.e,type:t.t,qty,items,
    score:t.s,verdict:t.v,tips:t.tips,allergens:t.al,conf:null,portion_note:'',thumb:null,demo:true};
}

// Meal totals come from its items (each with full nutrition x portion scale), so editing an item updates everything.
function mealBase(m){
  if(m.items&&m.items.length&&m.items.every(i=>i.n)){const o={};NK.forEach(k=>o[k]=0);m.items.forEach(i=>NK.forEach(k=>o[k]+=(i.n[k]||0)*(i.scale??1)));return o}
  return m.base||Object.fromEntries(NK.map(k=>[k,0]));
}
const mealN=m=>{const b=mealBase(m),o={};NK.forEach(k=>o[k]=(b[k]||0)*m.qty);return o};
const itemV=(it,k,q=1)=>(k==='grams'?(it.grams||0)*(it.scale??1):it.n?(it.n[k]||0)*(it.scale??1):(it[k]||0))*q;

const dayMeals=dk=>S.meals.filter(m=>dkey(new Date(m.ts))===dk).sort((a,b)=>a.ts-b.ts);
function dayTotals(dk){
  const t={calories:0,protein_g:0,carbs_g:0,fat_g:0,score:null,n:0};let sw=0,sc=0;
  dayMeals(dk).forEach(m=>{const n=mealN(m);t.calories+=n.calories;t.protein_g+=n.protein_g;t.carbs_g+=n.carbs_g;t.fat_g+=n.fat_g;sw+=n.calories;sc+=m.score*n.calories;t.n++});
  t.score=sw?sc/sw:null;return t;
}
function streak(){
  let d=new Date(),c=0;if(!dayMeals(dkey(d)).length)d=addDays(d,-1);
  while(dayMeals(dkey(d)).length){c++;d=addDays(d,-1);if(c>400)break}
  return c;
}
function calcPlan(p){
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*[1.2,1.375,1.55,1.725][p.act];
  let kcal=p.goal==='lose'?tdee-500:p.goal==='gain'?tdee+300:tdee;
  kcal=Math.round(Math.max(p.sex==='m'?1500:1200,kcal)/10)*10;
  const protein=Math.round(clamp(p.w*(p.goal==='gain'?2:1.8),50,kcal*.35/4)/5)*5;
  const fat=Math.round(kcal*.27/9/5)*5;
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4/5)*5);
  const rate=p.goal==='lose'?.45:p.goal==='gain'?.27:0;
  const diff=p.goal==='lose'?p.w-p.goalW:p.goal==='gain'?p.goalW-p.w:0;
  const weeks=rate&&diff>0?Math.ceil(diff/rate):0;
  return {kcal,protein,carbs,fat,water:Math.round(p.w*35/50)*50,tdee:Math.round(tdee),weeks};
}

/* ---------- animation helpers ---------- */
function countTo(el,to,dur=900){
  const dec=+el.dataset.dec||0,from=el._v!=null?el._v:(+el.dataset.from||0);
  el._v=to;cancelAnimationFrame(el._raf);
  const put=v=>{el.textContent=fmt(v,dec)};
  if(reduce||from===to){put(to);return}
  const t0=performance.now();
  const tick=t=>{const k=clamp((t-t0)/dur,0,1),e=1-Math.pow(1-k,3);put(from+(to-from)*e);if(k<1)el._raf=requestAnimationFrame(tick)};
  el._raf=requestAnimationFrame(tick);
}
function mount(root=document){
  $$('[data-ring]',root).forEach(el=>{
    const id=el.dataset.ring,to=clamp(+el.dataset.to,0,1),C=+el.dataset.c,from=shown[id]!=null?shown[id]:0;
    el.style.transition='none';el.style.strokeDashoffset=C*(1-from);el.style.opacity=from>0?1:0;el.getBoundingClientRect();
    el.style.transition='';requestAnimationFrame(()=>{el.style.strokeDashoffset=C*(1-to);el.style.opacity=to>0?1:0});
    shown[id]=to;
  });
  $$('[data-count]',root).forEach(el=>{
    const id=el.dataset.cid,to=+el.dataset.count;
    el._v=id&&shown[id]!=null?shown[id]:0;countTo(el,to);if(id)shown[id]=to;
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$$('[data-w]',root).forEach(el=>{el.style.width=el.dataset.w+'%'})}));
}
function ring(id,size,sw,pct,color,inner=''){
  const r=(size-sw)/2,C=2*Math.PI*r,c=size/2;
  const stroke=color.startsWith('url')?`stroke:${color}`:`stroke:${color}`;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
  <circle class="trk" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}"/>
  <circle class="prg" data-ring="${id}" data-to="${clamp(pct,0,1)}" data-c="${C}" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}" style="${stroke}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="ring-in">${inner}</div></div>`;
}

function weightChart(){
  const pts=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1).slice(-10);
  if(pts.length<2)return `<p class="muted sm" style="padding:24px 0;text-align:center">Log your weight twice to see a trend.</p>`;
  const W=320,H=150,pl=34,pr=12,pt=12,pb=24,v=pts.map(p=>p.kg);
  let lo=Math.floor(Math.min(...v)-.5),hi=Math.ceil(Math.max(...v)+.5);if(hi-lo<2)hi=lo+2;
  const x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=n=>pt+(hi-n)/(hi-lo)*(H-pt-pb);
  let d=`M${x(0)},${y(v[0])}`;for(let i=1;i<v.length;i++){const cx=(x(i-1)+x(i))/2;d+=` C${cx},${y(v[i-1])} ${cx},${y(v[i])} ${x(i)},${y(v[i])}`}
  const ar=`${d} L${x(v.length-1)},${H-pb} L${x(0)},${H-pb} Z`,mid=(lo+hi)/2,n=pts.length-1;
  const lab=n=>fmt(n,n%1?1:0);
  const xl=[[0,'start'],[n,'end']].concat(n>=4?[[Math.round(n/2),'middle']]:[]).map(([i,a])=>`<text x="${x(i)}" y="${H-6}" text-anchor="${a}">${shortDate(fromKey(pts[i].d))}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend"><defs><linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--leaf);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--leaf);stop-opacity:0"/></linearGradient></defs>
  ${[lo,mid,hi].map(g=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(g)}" y2="${y(g)}"/><text x="${pl-6}" y="${y(g)+3.5}" text-anchor="end">${lab(g)}</text>`).join('')}
  <path class="ar" d="${ar}" fill="url(#gw)"/><path class="ln" pathLength="1" d="${d}"/>
  <circle class="halo" cx="${x(n)}" cy="${y(v[n])}" r="7" fill="var(--leaf)" opacity=".4"/><circle class="pd" cx="${x(n)}" cy="${y(v[n])}" r="5.5" fill="var(--surface)" stroke="var(--leaf)" stroke-width="3"/>${xl}</svg>`;
}
function weekBars(){
  const P=S.profile.plan,days=[...Array(7)].map((_,i)=>addDays(new Date(),i-6)),vals=days.map(d=>dayTotals(dkey(d)).calories);
  const top=Math.ceil(Math.max(P.kcal*1.15,...vals)/500)*500,step=top<=3000?500:1000,W=320,H=170,pl=36,pr=6,pt=18,pb=24;
  const y=v=>pt+(1-v/top)*(H-pt-pb),slot=(W-pl-pr)/7,bw=22;let g='';
  for(let t=0;t<=top;t+=step)g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+3.5}" text-anchor="end">${fmt(t)}</text>`;
  const bars=vals.map((v,i)=>{const cx=pl+(i+.5)*slot,h=Math.max(0,y(0)-y(v)),isT=i===6,over=v>P.kcal*1.08;
    return `<g>${v>0?`<rect class="cbar" style="--i:${i}" x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${h}" rx="7" fill="${over?'var(--bad)':'var(--good)'}" opacity="${isT?1:.62}"/><text x="${cx}" y="${y(v)-5}" text-anchor="middle">${fmt(v)}</text>`:`<text x="${cx}" y="${y(0)-5}" text-anchor="middle">–</text>`}<text x="${cx}" y="${H-6}" text-anchor="middle" style="${isT?'fill:var(--ink)':''}">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][days[i].getDay()]}</text></g>`}).join('');

}

const CH={busy:false,err:null,ctl:null};
const SUGS=['Rate my day so far','What should I eat for dinner?','Am I getting enough protein?','আজ রাতে কী খাবো?','Ei khabar ta ki healthy?','How can I lose weight faster?'];
const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
function md(src){
  let out='',ul=false;
  for(const ln of esc(src).split('\n')){const m=ln.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if(m){if(!ul){out+='<ul>';ul=true}out+=`<li>${inl(m[1])}</li>`}else{if(ul){out+='</ul>';ul=false}if(ln.trim())out+=`<p>${inl(ln)}</p>`}}
  return out+(ul?'</ul>':'');
}
const bubble=m=>m.role==='user'?`<div class="msg u">${esc(m.content).replace(/\n/g,'<br>')}</div>`:`<div class="msg a">${md(m.content)}</div>`;
function chatInner(){
  if(!S.chat.length&&!CH.busy&&!CH.err)return `<div class="coach-empty rise"><div class="av">${ico('spark',36,2)}</div><h2 class="disp" style="font-size:24px;font-weight:800">Hi, I am your coach</h2><p class="muted" style="max-width:30ch">I know your plan and what you logged today. Ask in English, বাংলা or Banglish.</p><div class="sugs">${SUGS.map(x=>`<button data-act="chat-sugg" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`;
  let h=S.chat.map(bubble).join('');
  if(CH.err==='noai')h+=`<div class="msg a">The coach needs an AI connection. ${inClaude()?'Allow Calorie Ai to use Claude when it asks, then send again.':'Please try again in a moment.'}<br><button class="chip" style="margin-top:8px" data-act="open-settings">Open settings</button></div>`;
  else if(CH.err)h+=`<div class="msg a err">${esc(CH.err)}</div>`;
  return h;
}
function renderCoach(){
  const has=S.chat.length;
  $('#view').innerHTML=`<div class="pad"><header class="ph rise" style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px"><div><h1>Coach</h1><p class="muted sm" style="margin-top:2px">Ask about food, goals and your day</p></div>${has?'<button class="btn sm ghost" data-act="chat-clear">Clear</button>':''}</header><div class="chat" id="chat">${chatInner()}</div></div>`;

const scrollEnd=()=>{const v=$('#view');if(v)v.scrollTop=v.scrollHeight};
function coachSystem(){
  const p=S.profile,P=p.plan,dk=dkey(),t=dayTotals(dk),ms=dayMeals(dk);
  const wk=[...Array(7)].map((_,i)=>dayTotals(dkey(addDays(new Date(),i-6)))).filter(x=>x.n);

${meals}
LAST 7 DAYS (days with logs): average ${avg('calories')} kcal and ${avg('protein_g')} g protein per day. Current streak: ${streak()} days.${ws.length?` Weight trend: ${ws.slice(-4).map(w=>w.kg+' kg').join(' → ')}.`:''}
Local time now: ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}.`;

function chatTurns(){
  const out=[];
  for(const m of S.chat.slice(-14)){const r=m.role==='user'?'user':'assistant';if(out.length&&out[out.length-1].role===r)out[out.length-1].content+='\n\n'+m.content;else out.push({role:r,content:m.content})}
  while(out.length&&out[0].role!=='user')out.shift();
  return out;

async function sendChat(text){
  if(CH.busy)return;const inp=$('#chatIn');text=String(text!=null?text:(inp?inp.value:'')).trim();if(!text)return;
  if(inp){inp.value='';inp.style.height=''}
  CH.err=null;S.chat.push({role:'user',content:text});save();
  if(!engine()){CH.err='noai';renderCoach();return}
  CH.busy=true;const cb=$('#chatbar');if(cb)cb.classList.add('busy');renderCoach();
  const live=document.createElement('div');live.className='msg a typing';live.innerHTML='<i></i><i></i><i></i>';const box=$('#chat');if(box)box.append(live);scrollEnd();
  try{
    const reply=await aiText({system:coachSystem(),turns:chatTurns(),onText:t=>{live.className='msg a';live.innerHTML=md(t);scrollEnd()}});
    S.chat.push({role:'assistant',content:String(reply).trim()});save();
  }catch(e){
    const k=errKind(e);CH.err=k==='badkey'?'Your API key was rejected. Check it in Profile.':k==='limit'?'Too many requests. Wait a moment and try again.':k==='net'?'Could not connect. Check your internet.':k==='denied'?'Allow Calorie Ai to use Claude when it asks, then try again.':k==='credit'?'Your Anthropic account has no credit left.':'The coach could not answer.'+errDetail(e)+' Try again.';
  }finally{CH.busy=false;const c=$('#chatbar');if(c)c.classList.remove('busy');if(S.tab==='coach')renderCoach()}
}

function normItem(i){
  const src=(i&&(i.n||i.nutrition))||i||{},n={};
  NK.forEach(k=>n[k]=clamp(num(src[k]),0,CAP[k]));
  const est=4*n.protein_g+4*n.carbs_g+9*n.fat_g;
  if(!n.calories||(est>20&&Math.abs(n.calories-est)/est>.35))n.calories=Math.round(est);
  NK.forEach(k=>n[k]=Math.round(n[k]*10)/10);
  return {name:String(i.name||'Food').slice(0,60),name_bn:String(i.name_bn||'').slice(0,60),emoji:hasEmoji(i.emoji)?firstGlyphs(i.emoji,2):'🍽️',grams:Math.round(clamp(num(i.grams),0,3000)),scale:1,n};
}
function normalize(r){
  if(!r||typeof r!=='object')throw {code:'invalid_json'};
  if(r.is_food===false)return {is_food:false,reason:String(r.reason||'').slice(0,140)};
  const items=(Array.isArray(r.items)?r.items:[]).slice(0,14).filter(i=>i&&typeof i==='object').map(normItem).filter(i=>i.n.calories>0);
  if(!items.length)throw {code:'invalid_json'};
  // if the model only gave meal totals for vitamins/minerals, spread them across items by calories
  const tot=r.nutrition&&typeof r.nutrition==='object'?r.nutrition:null,sc=items.reduce((x,i)=>x+i.n.calories,0)||1;
  if(tot&&items.every(i=>NK.slice(4).every(k=>!i.n[k])))items.forEach(i=>NK.slice(4).forEach(k=>i.n[k]=Math.round(clamp(num(tot[k]),0,CAP[k])*i.n.calories/sc*10)/10));
  const type=TYPES.includes(r.meal_type)?r.meal_type:typeByHour();
  return {is_food:true,name:String(r.meal_name||items[0].name).slice(0,70),name_bn:String(r.meal_name_bn||'').slice(0,70),emoji:hasEmoji(r.emoji)?firstGlyphs(r.emoji,2):items[0].emoji,
    type,conf:clamp(num(r.confidence,.75),0,1),portion_note:String(r.portion_note||'').slice(0,90),notes:String(r.estimation_notes||'').slice(0,200),items,
    score:clamp(Math.round(num(r.health_score,5)),1,10),verdict:String(r.verdict||'').slice(0,170),
    tips:(Array.isArray(r.tips)?r.tips:[]).slice(0,3).map(t=>String(t).slice(0,120)),allergens:(Array.isArray(r.allergens)?r.allergens:[]).slice(0,8).map(t=>String(t).slice(0,20))};
}

async function runAnalysis(inp){
  if(!canScan()){renderScan();adGateSheet();return}
  const ctl=new AbortController();AN={ctl};SC.input=inp;
  stopCam();

    if(inp.file){
      const prep=await prepImage(inp.file);inp.blob=prep.blob;inp.thumb=prep.thumb;inp.url=prep.url;
      if(SC.url)URL.revokeObjectURL(SC.url);SC.url=prep.url;delete inp.file;
    }
    inp.note=inp.note||SC.note||'';
    renderAnalyzing(inp);setAnStep(0);
    const eng=engine();
    if(!eng){AN=null;renderScanError('noai');return}
    if(eng==='claude'&&inp.blob&&aiLimits&&!aiLimits.images){AN=null;renderScanError('noimg');return}
    let started=false,k=0;
    const timer=setInterval(()=>{if(!started&&k<2){k++;setAnStep(k)}},2300);
    const onText=t=>{if(!started){started=true;setAnStep(3);const b=$('#anBar');if(b)b.classList.remove('ind')}
      const f=$('#anBar i');if(f)f.style.width=clamp(t.length/3600*100,8,96)+'%'};
    let raw;try{raw=await aiText({prompt:buildPrompt(inp),blob:inp.blob,json:true,signal:ctl.signal,onText})}finally{clearInterval(timer)}
    const res=normalize(raw);AN=null;
    if(!res.is_food){renderScanError('notfood',res.reason);return}
    countScan();
    $$('#anSteps li').forEach(li=>{li.className='done';li.firstChild.innerHTML=ico('check',12,3.6)});
    const b=$('#anBar i');if(b)b.style.width='100%';
    await wait(reduce?0:450);
    if(!$('#scan').classList.contains('on'))return;
    openResult(resultMeal(res,inp),{mode:'new',input:inp});
  }catch(e){
    AN=null;if(e&&e.code==='cancelled'){if($('#scan').classList.contains('on'))renderScan();return}
    if(!$('#scan').classList.contains('on'))return;
    renderScanError(errKind(e),e&&e.message,e&&e.code);
  }
}

   case 'prov':CFG.prov=v;saveCfg();paintAI();renderView();break;
   case 'key-test':{const dg=$('#keyDiag'),say=t=>{if(dg)dg.textContent=t};say('Testing…');toast('Testing key…');
     (async()=>{try{const t=await aiText({prompt:'Reply with the single word OK.'});
        const e=engine();say('Works'+(e==='gemini'&&GEM_OK[CFG.acc]?' with '+GEM_OK[CFG.acc]:e==='groq'&&GRQ_OK[CFG.acc]?' with '+GRQ_OK[CFG.acc]:'')+'. Reply: '+String(t).slice(0,40));toast('Key works')}
       catch(er){const k=errKind(er);say('Failed'+errDetail(er));
        if(engine()==='gemini'){try{const l=await gemDiscover();say('Failed'+errDetail(er)+'. Models your key can use: '+(l.slice(0,8).join(', ')||'none'))}catch(e2){say('Failed'+errDetail(er)+'. Could not list models'+errDetail(e2))}}
        if(engine()==='groq'){try{const l=await groqDiscover(false);say('Failed'+errDetail(er)+'. Models your key can use: '+(l.slice(0,8).join(', ')||'none'))}catch(e2){say('Failed'+errDetail(er)+'. Could not list models'+errDetail(e2))}}
        toast(k==='badkey'?'Key was rejected':k==='credit'?'No API credit left':k==='limit'?'Key is valid but the limit is reached. Wait a minute':k==='net'?'Could not connect':'Test failed. Details are shown below the buttons')}})();break}
   case 'chat-send':sendChat();break;
   case 'chat-sugg':sendChat(v);break;
   case 'chat-clear':S.chat=[];CH.err=null;save();renderCoach();break;
   case 'mic':toggleMic();break;
   case 'vlang':VLANG=v;$$('.vlang button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));break;
   case 'relog':{const c=structuredClone(RES.meal);c.id=uid();c.demo=false;const n=new Date(),d=S.selDate===dkey()?n:(()=>{const x=fromKey(S.selDate);x.setHours(n.getHours(),n.getMinutes());return x})();c.ts=d.getTime();c.base=mealBase(c);S.meals.push(c);save();$('#result').classList.remove('on');RES=null;renderView();toast(`Logged ${c.name} again`,()=>{S.meals=S.meals.filter(x=>x.id!==c.id);save();renderView()});break}
   case 'it+':case 'it-':{const it=RES.meal.items[+v];if(!it||!it.n)break;it.scale=clamp(Math.round(((it.scale??1)+(act==='it+'?.1:-.1))*10)/10,.1,4);const e2=$('#ip'+v);if(e2)e2.textContent=Math.round(it.scale*100)+'%';updateResult();break}
   case 'it-x':{if(RES.meal.items.length<2)break;RES.meal.items.splice(+v,1);renderItems();break}
   case 'water+':addWater(250);break;
   case 'water-':addWater(-250);break;
   case 'weight':weightSheet();break;
   case 'w+':case 'w-':{const el=$('#wv');let x=+el.dataset.v+(act==='w+'?.1:-.1);x=clamp(Math.round(x*10)/10,25,250);el.dataset.v=x;el.textContent=x.toFixed(1);break}
   case 'w-save':{const x=+$('#wv').dataset.v,k=dkey();S.weights=S.weights.filter(w=>w.d!==k);S.weights.push({d:k,kg:x,demo:false});S.profile.w=x;S.profile.plan=calcPlan(S.profile);save();closeSheet();renderView();toast('Weight logged');break}
   case 'sheet-close':closeSheet();break;
   case 'undo':{const t=$('#toast');const f=t._undo;t.classList.remove('on');if(f)f();break}
   case 'edit-plan':startOB(true);break;
   case 'clear-demo':S.meals=S.meals.filter(m=>!m.demo);S.weights=S.weights.filter(w=>!w.demo);save();renderView();toast('Sample data cleared');break;
   case 'reset':{if(!a._arm){a._arm=1;a.textContent='Tap again';setTimeout(()=>{a._arm=0;a.textContent='Reset'},2800);break}
     try{localStorage.removeItem(KEY)}catch(e){}S.profile=null;S.meals=[];S.weights=[];S.water={};S.tab='home';S.selDate=dkey();renderAll();startOB(false);break}
   case 'ob-next':if(OB.step===2&&OB.d.goal==='maintain')OB.d.goalW=OB.d.w;OB.step++;renderOB();break;
   case 'ob-back':OB.tok++;if(OB.step<=1&&OB.edit){$('#onb').classList.remove('on');break}OB.step=Math.max(0,OB.step-1);renderOB();break;
   case 'ob-skip':OB.step=3;renderOB();break;
   case 'ob-sex':OB.d.sex=v;$$('.seg button',$('#onb')).forEach(b=>b.classList.toggle('on',b.dataset.v===v));break;
   case 'ob-goal':{OB.d.goal=v;const w=OB.d.w;OB.d.goalW=v==='lose'?Math.max(30,w-5):v==='gain'?w+4:w;renderOB();break}
   case 'ob-act':OB.d.act=+v;$$('[data-act="ob-act"]',$('#onb')).forEach(b=>b.classList.toggle('on',b.dataset.v===v));break;
   case 'ob-finish':finishOB();break;
  }
});
document.addEventListener('input',e=>{
  const r=e.target.closest('input[type=range][data-field]');if(!r)return;
  const f=r.dataset.field,val=+r.value;OB.d[f]=val;$('#v-'+f).textContent=val;r.style.setProperty('--p',((val-r.min)/(r.max-r.min)*100)+'%');
  if(f==='w'&&OB.d.goal!=='maintain'){OB.d.goalW=OB.d.goal==='lose'?Math.max(30,val-5):val+4}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='noteIn'){SC.note=t.value;return}
  if(t.id==='chatIn'){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='chatIn'&&e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer: coarse)').matches){e.preventDefault();sendChat();return}
  const t=e.target.closest&&e.target.closest('[role=button][data-act]');
  if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.click()}
});
function onFile(e){const f=e.target.files&&e.target.files[0];if(f)runAnalysis({mode:SC.mode==='label'?'label':'photo',file:f})}
$('#camIn').addEventListener('change',onFile);$('#galIn').addEventListener('change',onFile);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if($('#sheet').classList.contains('on'))closeSheet();else if($('#result').classList.contains('on'))closeResult();else if($('#scan').classList.contains('on'))closeScan()});

/* ---------- ads + scan limit ---------- */
const FREE_SCANS=5,ADS_NEEDED=2,ACCESS_MS=3*24*60*60*1000,AD_WAIT=10;
const AKEY='calai.access.v1';
const AC=(()=>{try{return Object.assign({used:0,until:0},JSON.parse(localStorage.getItem(AKEY))||{})}catch(e){return {used:0,until:0}}})();
const saveAC=()=>{try{localStorage.setItem(AKEY,JSON.stringify(AC))}catch(e){}};
function hasPass(){if(AC.until&&AC.until<=Date.now()){AC.until=0;AC.used=0;saveAC()}return AC.until>Date.now()}
const scansLeft=()=>Math.max(0,FREE_SCANS-AC.used);
const canScan=()=>hasPass()||scansLeft()>0;
function countScan(){if(hasPass())return;AC.used++;saveAC()}
function promoHTML(){
  if(hasPass()){const d=Math.max(1,Math.ceil((AC.until-Date.now())/86400000));
    return `<div class="pad rise" style="--i:1"><div class="promo on"><div><b>Full access active</b><span class="bn">ফুল ফ্রি অ্যাক্সেস চালু আছে</span><small>${d} ${d===1?'day':'days'} left · unlimited scans</small></div><span class="pbtn">${ico('check',18,3)}</span></div></div>`}
  const l=scansLeft();
  return `<div class="pad rise" style="--i:1"><button class="promo" data-act="ad-open"><div><b>Watch ads, get 3 days full access</b><span class="bn">অ্যাড দেখুন, ৩ দিন ফুল ফ্রি অ্যাক্সেস নিন</span><small>${l} free ${l===1?'scan':'scans'} left</small></div><span class="pbtn">Watch ad</span></button></div>`;
}
const AD={n:0,busy:false,t:null};
function adGateSheet(){
  const n=AD.n;
  openSheet(`<div class="bigflame">${ico('bolt',40,2)}</div>
   <h2 style="text-align:center">Free scans used up</h2>
   <p class="bn muted" style="text-align:center;margin-top:-6px">${FREE_SCANS}টি ফ্রি স্ক্যান শেষ। ${ADS_NEEDED}টি অ্যাড দেখুন, ৩ দিন ফুল ফ্রি অ্যাক্সেস পান।</p>
   <div class="adsteps">${[...Array(ADS_NEEDED)].map((_,i)=>`<div class="adstep ${i<n?'done':''}"><i>${i<n?ico('check',14,3.4):i+1}</i><span>Ad ${i+1} of ${ADS_NEEDED}</span></div>`).join('')}</div>
   <button class="btn acc block" id="adBtn" data-act="ad-watch">Watch ad ${n+1} of ${ADS_NEEDED}</button>
   <p class="note" style="text-align:center">Full access lasts 3 days, then you get ${FREE_SCANS} free scans again.</p>`);
}
function adWatch(){
  if(AD.busy)return;
  AD.busy=true;const end=Date.now()+AD_WAIT*1000;
  const tick=()=>{
    const s=Math.ceil((end-Date.now())/1000),b=$('#adBtn');
    if(s>0){if(b){b.disabled=true;b.textContent=`Wait ${s}s…`}return}
    clearInterval(AD.t);AD.busy=false;AD.n++;
    if(AD.n>=ADS_NEEDED)grantPass();else adGateSheet();
  };
  tick();AD.t=setInterval(tick,300);
}
function grantPass(){
  AC.until=Date.now()+ACCESS_MS;AC.used=0;saveAC();AD.n=0;closeSheet();if(S.profile)renderView();
  toast('Full access unlocked until '+shortDate(new Date(AC.until)));
}

/* ---------- boot ---------- */
(function init(){
  /* keep the app frame pinned: focusing an input must never scroll the frame itself */
  const appEl=$('#app');if(appEl)appEl.addEventListener('scroll',()=>{if(appEl.scrollTop)appEl.scrollTop=0;if(appEl.scrollLeft)appEl.scrollLeft=0},{passive:true});
  const s=load();if(s&&s.profile){S.profile=s.profile;S.meals=s.meals||[];S.weights=s.weights||[];S.water=s.water||{};S.chat=s.chat||[]
    if(!S.profile.noDemo){S.profile.noDemo=1;if(S.meals.some(m=>m.demo)||S.weights.some(w=>w.demo)){S.meals=S.meals.filter(m=>!m.demo);S.weights=S.weights.filter(w=>!w.demo);if(!S.weights.length)S.weights=[{d:dkey(),kg:S.profile.w,demo:false}];S.water={}}save()}}
  S.selDate=dkey();renderAll();
  if(!S.profile)startOB(false);
})();
})();
</script>
</body></html>
